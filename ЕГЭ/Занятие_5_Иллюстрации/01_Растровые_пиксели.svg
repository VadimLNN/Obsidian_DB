<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
<rect width="1100" height="520" fill="white"/>
<text x="550" y="48" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700">Растровое изображение = таблица пикселей</text>
<g transform="translate(110,95)">
  <rect x="0" y="0" width="560" height="330" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
  <g stroke="#94a3b8" stroke-width="2">
    <path d="M70 0V330 M140 0V330 M210 0V330 M280 0V330 M350 0V330 M420 0V330 M490 0V330"/>
    <path d="M0 55H560 M0 110H560 M0 165H560 M0 220H560 M0 275H560"/>
  </g>
  <g fill="#dbeafe">
    <rect x="1" y="1" width="68" height="53"/><rect x="141" y="56" width="68" height="53"/>
    <rect x="281" y="111" width="68" height="53"/><rect x="421" y="166" width="68" height="53"/>
    <rect x="71" y="221" width="68" height="53"/><rect x="351" y="276" width="68" height="53"/>
  </g>
  <text x="280" y="365" text-anchor="middle" font-family="DejaVu Sans" font-size="23">W пикселей по ширине</text>
  <text x="-175" y="-30" transform="rotate(-90)" text-anchor="middle" font-family="DejaVu Sans" font-size="23">H пикселей по высоте</text>
</g>
<g transform="translate(735,125)">
  <text x="150" y="0" text-anchor="middle" font-family="DejaVu Sans" font-size="24">Каждый пиксель хранит цвет</text>
  <rect x="20" y="45" width="260" height="80" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/>
  <text x="150" y="95" text-anchor="middle" font-family="DejaVu Sans" font-size="31" font-weight="700">i бит / пиксель</text>
  <text x="150" y="175" text-anchor="middle" font-family="DejaVu Sans" font-size="22">Всего пикселей:</text>
  <text x="150" y="215" text-anchor="middle" font-family="DejaVu Sans" font-size="32" font-weight="700">W · H</text>
  <text x="150" y="275" text-anchor="middle" font-family="DejaVu Sans" font-size="22">Объём:</text>
  <text x="150" y="320" text-anchor="middle" font-family="DejaVu Sans" font-size="32" font-weight="700">I = W · H · i</text>
  <text x="150" y="355" text-anchor="middle" font-family="DejaVu Sans" font-size="20">бит</text>
</g>
</svg>