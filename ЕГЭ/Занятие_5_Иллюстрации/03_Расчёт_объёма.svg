<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390">
<rect width="1200" height="390" fill="white"/>
<text x="600" y="48" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700">Как считать объём изображения</text>
<g font-family="DejaVu Sans">
  <rect x="55" y="115" width="220" height="105" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="165" y="157" text-anchor="middle" font-size="22">Пиксели</text>
  <text x="165" y="195" text-anchor="middle" font-size="27" font-weight="700">W · H</text>

  <path d="M285 168H375" stroke="#334155" stroke-width="4"/><path d="M365 158L380 168L365 178" fill="none" stroke="#334155" stroke-width="4"/>
  <text x="330" y="145" text-anchor="middle" font-size="20">× i</text>

  <rect x="390" y="115" width="220" height="105" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="500" y="157" text-anchor="middle" font-size="22">Биты</text>
  <text x="500" y="195" text-anchor="middle" font-size="27" font-weight="700">W · H · i</text>

  <path d="M620 168H710" stroke="#334155" stroke-width="4"/><path d="M700 158L715 168L700 178" fill="none" stroke="#334155" stroke-width="4"/>
  <text x="665" y="145" text-anchor="middle" font-size="20">÷ 8</text>

  <rect x="725" y="115" width="180" height="105" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="815" y="157" text-anchor="middle" font-size="22">Байты</text>
  <text x="815" y="195" text-anchor="middle" font-size="22">I / 8</text>

  <path d="M915 168H1000" stroke="#334155" stroke-width="4"/><path d="M990 158L1005 168L990 178" fill="none" stroke="#334155" stroke-width="4"/>
  <text x="957" y="145" text-anchor="middle" font-size="20">÷ 1024</text>

  <rect x="1015" y="115" width="140" height="105" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="1085" y="157" text-anchor="middle" font-size="22">Кбайты</text>
  <text x="1085" y="195" text-anchor="middle" font-size="22">...</text>
</g>
<text x="600" y="285" text-anchor="middle" font-family="DejaVu Sans" font-size="22">1 байт = 8 бит · 1 Кбайт = 1024 байта · 1 Мбайт = 1024 Кбайта</text>
<text x="600" y="330" text-anchor="middle" font-family="DejaVu Sans" font-size="22" font-weight="700">Не округляй глубину цвета вниз: 257 цветов требуют уже 9 бит.</text>
</svg>