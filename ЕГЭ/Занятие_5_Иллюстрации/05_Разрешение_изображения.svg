<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460">
<rect width="1100" height="460" fill="white"/>
<text x="550" y="48" text-anchor="middle" font-family="DejaVu Sans" font-size="30" font-weight="700">DPI: почему при удвоении разрешения объём растёт в 4 раза</text>
<g font-family="DejaVu Sans">
  <rect x="120" y="120" width="280" height="210" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
  <g stroke="#94a3b8">
    <path d="M190 120V330 M260 120V330 M330 120V330"/>
    <path d="M120 172H400 M120 225H400 M120 278H400"/>
  </g>
  <text x="260" y="375" text-anchor="middle" font-size="26" font-weight="700">150 dpi</text>

  <path d="M455 225H635" stroke="#334155" stroke-width="4"/><path d="M620 212L640 225L620 238" fill="none" stroke="#334155" stroke-width="4"/>
  <text x="545" y="195" text-anchor="middle" font-size="22">dpi × 2</text>
  <text x="545" y="270" text-anchor="middle" font-size="22">пикселей × 4</text>

  <rect x="700" y="120" width="280" height="210" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/>
  <g stroke="#94a3b8">
    <path d="M735 120V330 M770 120V330 M805 120V330 M840 120V330 M875 120V330 M910 120V330 M945 120V330"/>
    <path d="M700 146H980 M700 172H980 M700 198H980 M700 224H980 M700 250H980 M700 276H980 M700 302H980"/>
  </g>
  <text x="840" y="375" text-anchor="middle" font-size="26" font-weight="700">300 dpi</text>
</g>
<text x="550" y="425" text-anchor="middle" font-family="DejaVu Sans" font-size="23">Для одной и той же фотографии: I₂ / I₁ = (dpi₂ / dpi₁)²</text>
</svg>